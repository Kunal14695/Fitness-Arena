<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Arena - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d0f12;
      --card-bg: #161a22;
      --card-border: #252c3b;
      --primary: #ff5722;
      --primary-hover: #f4511e;
      --accent-glow: rgba(255, 87, 34, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background-image: radial-gradient(circle at top, rgba(255, 87, 34, 0.1) 0%, transparent 70%);
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      text-decoration: none;
      margin-bottom: 8px;
    }

    .logo span {
      color: var(--primary);
    }

    .header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      background: #0f1218;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #e64a19);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px -6px rgba(255, 87, 34, 0.5);
      margin-top: 10px;
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--primary-hover), #d84315);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #6ee7b7;
    }

    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .footer-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 87, 34, 0.12);
      border: 1px solid rgba(255, 87, 34, 0.3);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .features-pill {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .pill-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <a href="/" class="logo">
        🏋️‍♂️ Fitness<span>Arena</span>
      </a>
      <p>Join the arena and unlock your personalized fitness path</p>
    </div>

    <div class="card">
      <div style="text-align: center;">
        <span class="step-badge">🚀 Step 1 • Quick Account Signup</span>
      </div>

      <div id="errorAlert" class="alert alert-error"></div>
      <div id="successAlert" class="alert alert-success"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password (min 6 characters)</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
        </div>

        <button type="submit" id="submitBtn" class="btn">
          Create Account & Continue →
        </button>
      </form>

      <div class="footer-links">
        Already have an account? <a href="/login">Log in here</a>
      </div>

      <div class="features-pill">
        <div class="pill-item">🔥 Streaks</div>
        <div class="pill-item">🥗 Macro Plans</div>
        <div class="pill-item">🏆 Tiers</div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating account...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const regRes = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const regData = await regRes.json();
        if (!regRes.ok) {
          throw new Error(regData.error || (regData.details && regData.details.join(', ')) || 'Registration failed');
        }

        const token = regData.data.token;
        localStorage.setItem('fitness_token', token);

        successAlert.innerText = 'Account created! Loading your personalization wizard...';
        successAlert.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/onboarding';
        }, 600);

      } catch (err) {
        errorAlert.innerText = err.message;
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Create Account & Continue →';
      }
    });
  </script>
</body>
</html>
